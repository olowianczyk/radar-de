<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR Business Partner — BSH</title>
<link rel="stylesheet" href="styles.css">
<style>
  html, body { height: 100%; }
  #intro {
    position: relative; width: 100%; height: 100vh; min-height: 600px;
    background: var(--canvas); overflow: hidden; font-family: 'Figtree', sans-serif;
  }
  #intro a { color: var(--brand); }
  #intro a:hover { color: var(--brand-hover); }

  .header {
    position: absolute; top: 24px; left: 28px; right: 28px; z-index: 10;
    display: flex; align-items: center; gap: 16px;
    transition: opacity .5s ease;
  }
  .progress-track { flex: 1; display: flex; gap: 6px; }
  .progress-seg { flex: 1; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: var(--brand); transition: width .1s linear; }
  .mute-btn {
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; color: var(--text-muted);
  }
  .skip-btn {
    background: transparent; border: none; font-family: 'Figtree', sans-serif;
    font-size: 13px; font-weight: 600; color: var(--text-muted); letter-spacing: .02em;
    cursor: pointer; padding: 8px 14px; border-radius: 999px;
    transition: background .16s ease, color .16s ease;
  }
  .skip-btn:hover { background: var(--surface-sunken); color: var(--text-strong); }

  .scene {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .7s ease;
  }
  .scene.active { opacity: 1; pointer-events: auto; }

  .word { display: inline-block; opacity: 0; transform: translateY(14px); transition: opacity .55s ease, transform .55s ease; }
  .scene.active .word { opacity: 1; transform: translateY(0); }

  #scene-mark img { width: 480px; height: auto; opacity: 0; transform: scale(.94); transition: opacity .7s ease, transform .7s ease; }
  #scene-mark.active img { opacity: 1; transform: scale(1); }
  #scene-mark .mark-label { font-family: 'Figtree', sans-serif; font-size: 16px; font-weight: 600; color: var(--text-muted); letter-spacing: .14em; text-transform: uppercase; margin-top: 22px; opacity: 0; transition: opacity .7s ease .15s; }
  #scene-mark.active .mark-label { opacity: 1; }

  #scene-tagline { align-items: flex-start; padding: 0 140px; }
  #scene-tagline .badge { display: flex; align-items: center; gap: 10px; margin-bottom: 40px; opacity: 0; transition: opacity .5s ease; }
  #scene-tagline.active .badge { opacity: 1; }
  #scene-tagline .badge-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--accent); }
  #scene-tagline .badge-label { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; color: var(--brand); letter-spacing: .08em; }
  #scene-tagline .tagline { font-family: 'Fraunces', serif; font-size: 58px; font-weight: 600; color: var(--text-strong); line-height: 1.12; letter-spacing: -.01em; display: flex; flex-wrap: wrap; gap: 0 .28em; max-width: 900px; }
  #scene-tagline .subtext { margin-top: 28px; max-width: 620px; font-family: 'Figtree', sans-serif; font-size: 22px; color: var(--text-muted); line-height: 1.5; opacity: 0; transform: translateY(14px); transition: opacity .55s ease .8s, transform .55s ease .8s; }
  #scene-tagline.active .subtext { opacity: 1; transform: translateY(0); }

  #scene-feed .feed-eyebrow-wrap { text-align: center; margin-bottom: 34px; }
  #scene-feed .feed-eyebrow, #scene-feed .feed-heading { opacity: 0; transition: opacity .5s ease; }
  #scene-feed.active .feed-eyebrow, #scene-feed.active .feed-heading { opacity: 1; }
  #scene-feed .feed-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; color: var(--accent-hover); letter-spacing: .1em; margin-bottom: 12px; }
  #scene-feed .feed-heading { font-family: 'Fraunces', serif; font-size: 40px; font-weight: 600; color: var(--text-strong); }
  #scene-feed .feed-list { display: flex; flex-direction: column; gap: 16px; }
  .feed-card {
    opacity: 0; transform: translateX(40px); transition: opacity .55s ease, transform .55s ease;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 18px 22px; display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 8px 24px rgba(120,90,60,.08); width: 640px; max-width: 82vw;
  }
  #scene-feed.active .feed-card { opacity: 1; transform: translateX(0); }
  .feed-card .tag { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--brand); font-weight: 600; letter-spacing: .04em; margin-bottom: 6px; }
  .feed-card .title { font-family: 'Figtree', sans-serif; font-size: 19px; font-weight: 600; color: var(--text-strong); }
  .feed-card .pill { font-family: 'Figtree', sans-serif; font-size: 12.5px; font-weight: 700; padding: 6px 14px; border-radius: 999px; letter-spacing: .02em; white-space: nowrap; }
  .feed-card .pill.new { background: var(--accent-soft); color: var(--accent-hover); }
  .feed-card .pill.review { background: var(--brand-soft); color: var(--brand); }

  #scene-quote { padding: 0 200px; }
  #scene-quote .mark-glyph { font-family: 'Fraunces', serif; font-size: 140px; line-height: .5; color: var(--accent); opacity: .28; }
  #scene-quote .quote-text { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 44px; color: var(--text-strong); text-align: center; line-height: 1.35; max-width: 900px; margin-top: 8px; opacity: 0; transform: translateY(14px); transition: opacity .6s ease .15s, transform .6s ease .15s; }
  #scene-quote.active .quote-text { opacity: 1; transform: translateY(0); }
  #scene-quote .quote-rule { opacity: 0; width: 56px; height: 3px; background: var(--brand); margin-top: 30px; transition: opacity .5s ease; }
  #scene-quote.active .quote-rule { opacity: 1; }

</style>
</head>
<body>
<div id="intro">
  <div class="header" id="header">
    <div class="progress-track" id="progress-track"></div>
    <div class="mute-btn" title="Bez dźwięku">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
    </div>
    <button class="skip-btn" id="skip-btn">Pomiń →</button>
  </div>

  <div class="scene" id="scene-mark">
    <img src="assets/logo-bsh.webp" alt="BSH" />
    <div class="mark-label">HR Business Partner</div>
  </div>

  <div class="scene" id="scene-tagline">
    <div class="badge">
      <div class="badge-dot"></div>
      <div class="badge-label">BSH / HR BP</div>
    </div>
    <div class="tagline" id="tagline-words"></div>
    <div class="subtext">Codzienny, automatyczny monitoring aktów prawnych — dla Twojego działu HR.</div>
  </div>

  <div class="scene" id="scene-feed">
    <div class="feed-eyebrow-wrap">
      <div class="feed-eyebrow" id="feed-eyebrow"></div>
      <div class="feed-heading">Wykryto 3 zmiany w prawie</div>
    </div>
    <div class="feed-list" id="feed-list"></div>
  </div>

  <div class="scene" id="scene-quote">
    <div class="mark-glyph">”</div>
    <div class="quote-text" id="quote-text"></div>
    <div class="quote-rule"></div>
  </div>

</div>

<script>
// ponytail: direct port of the Design Compiler phase state machine (mark → tagline →
// feed → quote) to plain DOM/CSS class toggles — no framework needed for a linear timed
// sequence. After the quote, hands off straight into the app (no gate screen).
const BSH_QUOTES = [
  'Spokój HR-owca zaczyna się od tego, że nic go nie zaskoczy.',
  'Dobry HR Business Partner nie czeka na zmianę — jest na nią gotowy.',
  'Najlepsze decyzje HR podejmuje się ze świeżą wiedzą, nie z przeczuciem.',
  'Prawo pracy zmienia się codziennie — Twoja czujność nie musi.',
  'Bycie o krok przed zmianą to nie przypadek, to nawyk.',
];
function nextBshQuote() {
  const key = 'bshIntroQuoteIdx';
  let idx = parseInt(localStorage.getItem(key) || '-1', 10);
  if (!Number.isFinite(idx)) idx = -1;
  const next = (idx + 1) % BSH_QUOTES.length;
  try { localStorage.setItem(key, String(next)); } catch (e) {}
  return BSH_QUOTES[next];
}

const FEED = [
  { tag: 'Kodeks pracy', title: 'Nowe zasady urlopu rodzicielskiego', status: 'Nowe' },
  { tag: 'BHP', title: 'Rozporządzenie MRPiPS o szkoleniach BHP', status: 'Nowe' },
  { tag: 'PIP', title: 'Zaktualizowane wytyczne kontroli', status: 'W przeglądzie' },
];

const SCENES = ['scene-mark', 'scene-tagline', 'scene-feed', 'scene-quote'];
const DURATIONS = [1600, 2200, 2600, 1800]; // mark, tagline, feed, quote
const APP_URL = 'app/index.html';

function lastScanLabel() {
  const now = new Date();
  const scan = new Date(now);
  scan.setHours(6, 0, 0, 0);
  if (scan > now) scan.setDate(scan.getDate() - 1);
  const pad = (n) => String(n).padStart(2, '0');
  return `${pad(scan.getDate())}.${pad(scan.getMonth() + 1)}.${scan.getFullYear()} ${pad(scan.getHours())}:${pad(scan.getMinutes())} · SKAN ISAP`;
}

let phase = 0;
let phaseStartAt = Date.now();
let timers = [];
let progressTick = null;

function q(sel, root) { return (root || document).querySelector(sel); }

function buildTaglineWords() {
  const el = q('#tagline-words');
  el.innerHTML = '';
  'Zawsze o krok przed zmianą w prawie pracy.'.split(' ').forEach((text, i) => {
    const span = document.createElement('span');
    span.className = 'word';
    span.textContent = text;
    span.style.transitionDelay = `${i * 90}ms`;
    el.appendChild(span);
  });
}

function buildFeedCards() {
  const el = q('#feed-list');
  el.innerHTML = '';
  FEED.forEach((item, i) => {
    const isNew = item.status === 'Nowe';
    const card = document.createElement('div');
    card.className = 'feed-card';
    card.style.transitionDelay = `${i * 180}ms`;
    card.innerHTML = `
      <div>
        <div class="tag">${item.tag.toUpperCase()}</div>
        <div class="title">${item.title}</div>
      </div>
      <div class="pill ${isNew ? 'new' : 'review'}">${item.status}</div>`;
    el.appendChild(card);
  });
}

function buildProgressSegments() {
  const el = q('#progress-track');
  el.innerHTML = '';
  DURATIONS.forEach(() => {
    const seg = document.createElement('div');
    seg.className = 'progress-seg';
    seg.innerHTML = '<div class="progress-fill"></div>';
    el.appendChild(seg);
  });
}

function updateProgress() {
  const fills = document.querySelectorAll('.progress-fill');
  const elapsed = Date.now() - phaseStartAt;
  DURATIONS.forEach((d, s) => {
    const frac = s < phase ? 1 : s === phase ? Math.min(1, elapsed / d) : 0;
    fills[s].style.width = `${Math.round(frac * 1000) / 10}%`;
  });
}

function setPhase(next) {
  phase = next;
  phaseStartAt = Date.now();
  SCENES.forEach((id, i) => q('#' + id).classList.toggle('active', i === phase));
  updateProgress();
}

function clearTimers() { timers.forEach(clearTimeout); timers = []; }

function enterApp() { window.location.href = APP_URL; }

function schedule() {
  clearTimers();
  phaseStartAt = Date.now();
  let acc = 0;
  DURATIONS.forEach((d, i) => {
    acc += d;
    const isLast = i === DURATIONS.length - 1;
    timers.push(setTimeout(isLast ? enterApp : () => setPhase(i + 1), acc));
  });
}

function skip() { clearTimers(); enterApp(); }

function onKeyDown(e) {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.code === 'Escape' || e.code === 'Enter' || e.code === 'Space') {
    e.preventDefault();
    skip();
  }
}

function init() {
  q('#quote-text').textContent = nextBshQuote();
  q('#feed-eyebrow').textContent = lastScanLabel();
  buildTaglineWords();
  buildFeedCards();
  buildProgressSegments();
  setPhase(0);
  schedule();
  progressTick = setInterval(updateProgress, 80);
  q('#skip-btn').addEventListener('click', skip);
  window.addEventListener('keydown', onKeyDown);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
