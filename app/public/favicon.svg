<!-- Radar Legislacyjny favicon: static, simplified version of the animated
     sygnet in radar.css (dark disc, bezel, two range rings, crosshair, beam
     wedge at ~45°, one amber "fresh" blip, green "§" hub). Detail below
     ~16 px is dropped on purpose — ticks and grid would just turn to mush. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- bezel ring + screen -->
  <circle cx="32" cy="32" r="31" fill="#0a2c2a"/>
  <circle cx="32" cy="32" r="28" fill="#05191a" stroke="#1f8a76" stroke-width="2"/>
  <!-- range rings at 1/2 and 3/4 of the radius -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="#3DF5B0" stroke-opacity=".5" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#3DF5B0" stroke-opacity=".3" stroke-width="1"/>
  <!-- crosshair -->
  <path d="M32 5v54M5 32h54" stroke="#3DF5B0" stroke-opacity=".3" stroke-width="1"/>
  <!-- beam: wedge from 12 o'clock to ~45°, bright leading edge -->
  <path d="M32 32V4A28 28 0 0 1 51.8 12.2Z" fill="#3DF5B0" fill-opacity=".35"/>
  <path d="M32 32L51.8 12.2" stroke="#d4fff0" stroke-width="2"/>
  <!-- detected changes: one green, one amber "fresh" -->
  <circle cx="20" cy="45" r="2.6" fill="#3DF5B0"/>
  <circle cx="43" cy="47" r="3" fill="#FFB547"/>
  <!-- hub with the § sign -->
  <circle cx="32" cy="32" r="8" fill="#05191a" stroke="#3DF5B0" stroke-opacity=".7"/>
  <text x="32" y="36.5" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-weight="700" font-size="12" fill="#3DF5B0">§</text>
</svg>
