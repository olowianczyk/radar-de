<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Karta zmiany w przepisach — HR Business Partner Platform</title>
<link rel="stylesheet" href="./styles.css">
<style>
@page{size:A4;margin:20mm 18mm}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);color:var(--text-body);background:#fff}
.sheet{max-width:720px;margin:0 auto;padding:32px 8px}
.top{display:flex;align-items:center;justify-content:space-between;padding-bottom:18px;border-bottom:2px solid var(--brand)}
.top .brand{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--text-heading)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:700}
h1{font-family:var(--font-display);font-size:26px;color:var(--text-heading);margin:18px 0 4px;line-height:1.2}
.act{font-size:13px;color:var(--text-muted);margin-bottom:20px}
.badges{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:4px 10px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle);margin-bottom:20px}
.grid .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:700}
.grid .v{font-size:13.5px;color:var(--text-heading);font-weight:600;margin-top:3px}
.summary{font-size:14px;line-height:1.7;margin-bottom:24px}
.affected h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:700;margin:0 0 10px}
.doc{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 0;border-bottom:1px dashed var(--border-subtle)}
.footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--border-subtle);font-size:10.5px;color:var(--text-muted);display:flex;justify-content:space-between}
.sheet + .sheet{page-break-before:always;margin-top:0}
.actions{max-width:720px;margin:16px auto 0;display:flex;justify-content:flex-end}
.actions button{font:600 13px var(--font-sans);padding:9px 18px;border-radius:999px;border:none;background:var(--brand);color:#fff;cursor:pointer}
@media print{.actions{display:none}body{padding:0}}
</style>
</head>
<body>
<div id="sheets"></div>
<div class="actions"><button onclick="window.print()">Drukuj / Print / Drucken</button></div>
<script src="./print-data.js"></script>
<script>
const params = new URLSearchParams(location.search);
const lang = params.get("lang") || "pl";
const t = window.HRBP_I18N[lang];
// Rows come from the app via localStorage (real scan data lives in React state,
// not in any static file) — the app writes "hrbp-print" just before opening us.
let list = [];
try { list = JSON.parse(localStorage.getItem("hrbp-print") || "[]"); } catch (e) {}
// Titles/summaries come from an external API — escape before innerHTML.
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const areaTone = { brand: ["var(--brand-soft)", "var(--teal-800)"], blue: ["var(--blue-100)", "var(--blue-700)"], amber: ["var(--amber-100)", "var(--amber-600)"], neutral: ["var(--surface-sunken)", "var(--text-muted)"], green: ["var(--green-100)", "var(--green-700)"] };
const statusTone = { new: areaTone.blue, progress: areaTone.amber, waiting: areaTone.neutral, urgent: ["var(--red-100)", "var(--red-700)"], done: ["var(--green-100)", "var(--green-700)"] };
const now = new Date().toLocaleString(lang === "pl" ? "pl-PL" : lang === "de" ? "de-DE" : "en-GB");

document.getElementById("sheets").innerHTML = list.map((c) => {
  const [aBg, aFg] = areaTone[window.HRBP_AREA_TONE[c.area]] || areaTone.neutral;
  const [sBg, sFg] = statusTone[c.status] || areaTone.neutral;
  const stLabel = { new: t.st.new, progress: t.st.progress, waiting: t.st.waiting, urgent: t.st.urgent, done: t.st.done }[c.status];
  const affected = (c.affected || []).map((docId) => window.HRBP_KB.find((k) => k.id === docId)).filter(Boolean);
  return `
  <div class="sheet">
  <div class="top">
    <span class="brand">${esc(c.product || t.app)}</span>
    <span class="eyebrow">${esc(c.wsLabel ? `${c.wsLabel} · ${c.appTitle || ""}` : t.app)}</span>
  </div>
  <h1>${esc(c.title[lang] || c.title.pl)}</h1>
  <div class="act">${esc(c.act)}</div>
  <div class="badges">
    <span class="badge" style="background:${sBg};color:${sFg}">${stLabel}</span>
    <span class="badge" style="background:${aBg};color:${aFg}">${esc(c.areaLabel || t.area[c.area] || "")}</span>
  </div>
  <div class="grid">
    <div><div class="l">${t.published}</div><div class="v">${esc(c.date)}</div></div>
    <div><div class="l">${t.effective}</div><div class="v">${esc(c.effective)}</div></div>
    <div><div class="l">${t.source}</div><div class="v">${esc(c.source)}</div></div>
  </div>
  <p class="summary">${esc(c.summary[lang] || c.summary.pl)}</p>
  ${affected.length ? `<div class="affected"><h3>${t.affected}</h3>${affected.map((d) => `<div class="doc">• ${d.title[lang] || d.title.pl}</div>`).join("")}</div>` : ""}
  <div class="footer"><span>${now}</span><span>${esc(c.product || t.app)}${c.wsLabel ? " — " + esc(c.wsLabel) : ""}</span></div>
  </div>`;
}).join("") || `<div class="sheet"><p class="summary">${esc(t.feedEmptyTitle)}</p></div>`;
</script>
</body>
</html>
